<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Node Glow Gradients -->
    <linearGradient id="advocateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="skepticGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="auditorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Subtle Outer Ring Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Cryptographic Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 8" opacity="0.6" />
  <circle cx="256" cy="256" r="192" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Chained Connecting Rays (Tri-Prong Dialectic Convergence) -->
  <!-- Top Node: Risk Auditor (Amber) -->
  <line x1="256" y1="256" x2="256" y2="116" stroke="url(#auditorGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
  <!-- Bottom-Left Node: Advocate (Emerald) -->
  <line x1="256" y1="256" x2="135" y2="326" stroke="url(#advocateGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
  <!-- Bottom-Right Node: Skeptic (Rose) -->
  <line x1="256" y1="256" x2="377" y2="326" stroke="url(#skepticGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

  <!-- Tri-Lateral Confrontation Outer Bridge -->
  <polygon points="256,116 377,326 135,326" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Dialectic Agent Nodes -->
  <!-- Top: Risk Auditor -->
  <circle cx="256" cy="116" r="28" fill="#0f172a" stroke="url(#auditorGrad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="256" cy="116" r="12" fill="url(#auditorGrad)" />
  <!-- Small Hash Block Marker -->
  <rect x="250" y="110" width="12" height="12" rx="2" fill="#0f172a" opacity="0.6" />

  <!-- Bottom Left: The Advocate -->
  <circle cx="135" cy="326" r="28" fill="#0f172a" stroke="url(#advocateGrad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="135" cy="326" r="12" fill="url(#advocateGrad)" />

  <!-- Bottom Right: The Skeptic -->
  <circle cx="377" cy="326" r="28" fill="#0f172a" stroke="url(#skepticGrad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="377" cy="326" r="12" fill="url(#skepticGrad)" />

  <!-- Center Epistemic Convergence Nucleus -->
  <circle cx="256" cy="256" r="54" fill="#0f172a" stroke="url(#coreGrad)" stroke-width="5" filter="url(#glow)" />
  
  <!-- Calibrated Consensus Diamond -->
  <polygon points="256,224 288,256 256,288 224,256" fill="url(#coreGrad)" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />

  <!-- Cryptographic Hash Ring Elements -->
  <circle cx="256" cy="256" r="76" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.75" />
</svg>
