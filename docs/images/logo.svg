<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <!-- Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="amber-beak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="slate-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="40" stroke-linejoin="round" />

      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Outer Epistemic Deliberation Coordinate Crosshairs -->
      <line x1="-300" y1="0" x2="300" y2="0" stroke="#00f5ff" stroke-width="1.5" opacity="0.25" stroke-dasharray="8 8" />
      <line x1="0" y1="-340" x2="0" y2="340" stroke="#00f5ff" stroke-width="1.5" opacity="0.25" stroke-dasharray="8 8" />

      <!-- ======================================================== -->
      <!-- THE EPISTEMIC OWL MASCOT: Symmetrical Low-Poly Origami   -->
      <!-- ======================================================== -->

      <!-- 1. Watertight Solid Obsidian Base Silhouette -->
      <path d="
        M 0 -290
        L 45 -260 L 110 -310 L 125 -210 L 195 -180 L 255 -70 L 265 60 L 225 190 L 150 280 L 70 320 L 0 335
        L -70 320 L -150 280 L -225 190 L -265 60 L -255 -70 L -195 -180 L -125 -210 L -110 -310 L -45 -260 Z
      " fill="#0b0f19" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />

      <!-- 2. Symmetrical Low-Poly Armor Facets -->

      <!-- Forehead & Crown Center Triangles -->
      <polygon points="0,-290 45,-260 0,-210" fill="#334155" />
      <polygon points="0,-290 -45,-260 0,-210" fill="#1e293b" />

      <!-- Ear Tufts (Left & Right) -->
      <polygon points="45,-260 110,-310 75,-220" fill="#475569" />
      <polygon points="75,-220 110,-310 125,-210" fill="#1e293b" />
      <polygon points="-45,-260 -110,-310 -75,-220" fill="#334155" />
      <polygon points="-75,-220 -110,-310 -125,-210" fill="#0f172a" />

      <!-- Forehead Brow Plates -->
      <polygon points="0,-210 75,-220 70,-155 0,-145" fill="#1e293b" />
      <polygon points="0,-210 -75,-220 -70,-155 0,-145" fill="#0f172a" />
      <polygon points="75,-220 125,-210 145,-150 70,-155" fill="#334155" />
      <polygon points="-75,-220 -125,-210 -145,-150 -70,-155" fill="#1e293b" />

      <!-- Outer Temple & Head Facets -->
      <polygon points="125,-210 195,-180 185,-110 145,-150" fill="#475569" />
      <polygon points="-125,-210 -195,-180 -185,-110 -145,-150" fill="#334155" />
      <polygon points="195,-180 255,-70 200,-50 185,-110" fill="#1e293b" />
      <polygon points="-195,-180 -255,-70 -200,-50 -185,-110" fill="#0f172a" />

      <!-- Stereoscopic Facial Discs (Left & Right) -->
      <!-- Right Eye Socket Plates -->
      <polygon points="0,-145 70,-155 85,-75 0,-65" fill="#0f172a" />
      <polygon points="70,-155 145,-150 155,-65 85,-75" fill="#1e293b" />
      <polygon points="145,-150 185,-110 200,-50 155,-65" fill="#334155" />
      <!-- Left Eye Socket Plates -->
      <polygon points="0,-145 -70,-155 -85,-75 0,-65" fill="#0b0f19" />
      <polygon points="-70,-155 -145,-150 -155,-65 -85,-75" fill="#0f172a" />
      <polygon points="-145,-150 -185,-110 -200,-50 -155,-65" fill="#1e293b" />

      <!-- ELECTRIC CYAN EYES (Almond Predatory Cant & Calibrated Gaze) -->
      <!-- Right Eye -->
      <polygon points="40,-120 105,-110 95,-78 35,-88" fill="#0b0f19" stroke="#00f5ff" stroke-width="2" />
      <polygon points="46,-115 98,-107 89,-82 42,-90" fill="url(#cyan-glow)" />
      <!-- Left Eye -->
      <polygon points="-40,-120 -105,-110 -95,-78 -35,-88" fill="#0b0f19" stroke="#00f5ff" stroke-width="2" />
      <polygon points="-46,-115 -98,-107 -89,-82 -42,-90" fill="url(#cyan-glow)" />

      <!-- Precision Pupil Slits -->
      <polygon points="72,-116 75,-116 71,-79 68,-79" fill="#042f2e" />
      <polygon points="-72,-116 -75,-116 -71,-79 -68,-79" fill="#042f2e" />

      <!-- Precision Reticle Micro-Markers (Epistemic Dial Calibration) -->
      <circle cx="70" cy="-97" r="1.5" fill="#ffffff" />
      <circle cx="-70" cy="-97" r="1.5" fill="#ffffff" />

      <!-- Judicial Amber Beak (Crisp Low-Poly Diamond) -->
      <polygon points="0,-75 22,-35 0,22" fill="#fbbf24" />
      <polygon points="0,-75 -22,-35 0,22" fill="#d97706" />
      <polygon points="0,-75 14,-45 0,-30" fill="#fef3c7" opacity="0.6" />

      <!-- Lower Face & Cheeks -->
      <polygon points="22,-35 85,-75 120,0 45,35 0,22" fill="#1e293b" />
      <polygon points="-22,-35 -85,-75 -120,0 -45,35 0,22" fill="#0f172a" />
      <polygon points="85,-75 155,-65 175,20 120,0" fill="#334155" />
      <polygon points="-85,-75 -155,-65 -175,20 -120,0" fill="#1e293b" />

      <!-- Obsidian Wing Shoulders (Flanking Symmetry) -->
      <polygon points="155,-65 200,-50 245,30 175,20" fill="#475569" />
      <polygon points="-155,-65 -200,-50 -245,30 -175,20" fill="#334155" />
      <polygon points="200,-50 265,60 250,140 195,100 175,20" fill="#1e293b" />
      <polygon points="-200,-50 -265,60 -250,140 -195,100 -175,20" fill="#0f172a" />

      <!-- Outer Folded Primary Feathers -->
      <polygon points="250,140 225,190 175,170 195,100" fill="#334155" />
      <polygon points="-250,140 -225,190 -175,170 -195,100" fill="#1e293b" />
      <polygon points="225,190 150,280 135,210 175,170" fill="#1e293b" />
      <polygon points="-225,190 -150,280 -135,210 -175,170" fill="#0f172a" />

      <!-- Chest Armor: Dialectic Consensus Breastplate (Triple Node Framing) -->
      <!-- Center Throat Plate -->
      <polygon points="0,22 45,35 0,85" fill="#334155" />
      <polygon points="0,22 -45,35 0,85" fill="#1e293b" />

      <!-- Upper Pectoral Facets -->
      <polygon points="45,35 120,0 125,95 55,105 0,85" fill="#1e293b" />
      <polygon points="-45,35 -120,0 -125,95 -55,105 0,85" fill="#0f172a" />
      <polygon points="120,0 175,20 180,110 125,95" fill="#334155" />
      <polygon points="-120,0 -175,20 -180,110 -125,95" fill="#1e293b" />

      <!-- Center Epistemic Core Plate (Consensus Nexus Diamond) -->
      <polygon points="0,85 55,105 0,185" fill="#00f5ff" opacity="0.9" />
      <polygon points="0,85 -55,105 0,185" fill="#0284c7" opacity="0.9" />
      <polygon points="0,115 32,130 0,165" fill="#ffffff" opacity="0.4" />

      <!-- Mid-Chest Rib Armor -->
      <polygon points="55,105 125,95 110,185 0,185" fill="#1e293b" />
      <polygon points="-55,105 -125,95 -110,185 0,185" fill="#0f172a" />
      <polygon points="125,95 180,110 165,190 110,185" fill="#334155" />
      <polygon points="-125,95 -180,110 -165,190 -110,185" fill="#1e293b" />

      <!-- Lower Abdominal Cuirass & Talons Silhouette -->
      <polygon points="0,185 70,205 0,270" fill="#334155" />
      <polygon points="0,185 -70,205 0,270" fill="#1e293b" />
      <polygon points="70,205 110,185 135,260 65,275 0,270" fill="#1e293b" />
      <polygon points="-70,205 -110,185 -135,260 -65,275 0,270" fill="#0f172a" />

      <!-- Tail & Base Keel -->
      <polygon points="0,270 65,275 70,320 0,335" fill="#1e293b" />
      <polygon points="0,270 -65,275 -70,320 0,335" fill="#0f172a" />
      <polygon points="65,275 135,260 150,280 70,320" fill="#334155" />
      <polygon points="-65,275 -135,260 -150,280 -70,320" fill="#1e293b" />

      <!-- Triple-Node Dialectic Cryptographic Markers (Advocate Emerald, Skeptic Crimson, Auditor Amber) -->
      <!-- Advocate Node (Bottom Left Wing Tip) -->
      <circle cx="-135" cy="235" r="7" fill="#10b981" stroke="#0f172a" stroke-width="2" />
      <!-- Skeptic Node (Bottom Right Wing Tip) -->
      <circle cx="135" cy="235" r="7" fill="#f43f5e" stroke="#0f172a" stroke-width="2" />
      <!-- Risk Auditor Node (Forehead Apex) -->
      <circle cx="0" cy="-210" r="7" fill="#fbbf24" stroke="#0f172a" stroke-width="2" />

      <!-- Fine Outer Geometric Accent Lines -->
      <circle cx="0" cy="0" r="280" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.15" stroke-dasharray="4 8" />
    </g>
  </g>
</svg>
